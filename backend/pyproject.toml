[project]
name = "resumes2ai-backend"
version = "0.1.0"
description = "FastAPI backend for AI resume screening MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "uploads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
